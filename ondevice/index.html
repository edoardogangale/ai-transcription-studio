<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trascrizione sul dispositivo</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#ffffff;--bg2:#f6f6f4;--card:#ffffff;--fg:#1f2328;--mut:#6b7280;--line:#e6e6e2;--acc:#2563eb;--acc-ink:#fff;--ok:#15803d;--bad:#b91c1c;--play:#dbeafe;--r:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#191919;--bg2:#202020;--card:#252525;--fg:#ececec;--mut:#9a9a9a;--line:#383838;--acc:#5b9bff;--acc-ink:#0b1220;--ok:#4ade80;--bad:#f87171;--play:#1e3a5f;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar b{font-weight:650;letter-spacing:-.01em}.topbar .logo{color:var(--acc);margin-right:4px}.topbar nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.topbar nav a{padding:8px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-size:15px;white-space:nowrap;min-height:40px;display:flex;align-items:center}.topbar nav a.active{background:var(--bg2);color:var(--fg)}
body:has(main.full) .topbar{display:none}
main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:18px;margin:28px 0 10px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
button,select{font:inherit;color:inherit;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;margin:0;transition:transform .12s,background .2s}
button:hover{background:var(--bg2)}button:active{transform:scale(.97)}button:disabled{opacity:.45}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:600}button.primary:hover{filter:brightness(1.08);background:var(--acc)}
button.danger{color:var(--bad)}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.grow{flex:1}
.seg{margin:6px 0}.seg .t{color:var(--mut);font-size:13px;margin-right:6px}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
input[type=text]{font:inherit;color:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;width:100%}
.apptoast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:8px 16px;border-radius:20px;z-index:20}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{width:min(460px,100%);display:flex;flex-direction:column;gap:8px;background:var(--card)}
.segc{display:flex;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.segc button{flex:1;margin:0;min-height:38px;font-size:15px;background:transparent;border:0}.segc button.on{background:var(--acc);color:var(--acc-ink)}
.paperprev{--gap:12px;background-color:#fff;border-radius:6px;box-shadow:0 2px 8px #0005;max-height:180px;margin:6px auto;width:auto;height:160px}
.paperprev.lines{background-image:repeating-linear-gradient(#fff 0 calc(var(--gap) - 1px),#b9c6da calc(var(--gap) - 1px) var(--gap))}
.paperprev.grid{background-image:linear-gradient(#b9c6da 1px,transparent 1px),linear-gradient(90deg,#b9c6da 1px,transparent 1px);background-size:var(--gap) var(--gap)}
.paperprev.dots{background-image:radial-gradient(#9aa8bf 1.2px,transparent 1.4px);background-size:var(--gap) var(--gap)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pagecard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:0;text-align:left;color:var(--fg);box-shadow:var(--shadow);transition:transform .15s}.pagecard:hover{transform:translateY(-2px);background:var(--card)}
.pagecard .thumb{width:100%;height:140px;margin:0 0 4px;--gap:9px;box-shadow:none;border:1px solid var(--line)}
main.full{max-width:none;position:fixed;inset:0;margin:0;padding:env(safe-area-inset-top) 0 0;display:flex;flex-direction:column;background:#f2f2f7;color:#1c1c1e}
.split{flex:1;display:flex;min-height:0}.split.nopanel .txpanel,.split.nopanel .split-h{display:none}.nbhost{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}.nbhost>.ink{flex:1}
.split-h{width:10px;cursor:col-resize;background:#e5e5ea;touch-action:none;position:relative}.split-h::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:2px;background:#aeaeb2}
.txpanel{width:var(--w,360px);display:flex;flex-direction:column;background:#fff;min-height:0}
.txhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #e5e5ea}
.legend{font-size:12px;color:#8e8e93;display:flex;align-items:center;gap:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}.lg-s{background:#1c1c1e}.lg-m{background:#9b51e0}
.tx{flex:1;overflow-y:auto;padding:10px 16px 40px;font:19px/1.55 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#1c1c1e;-webkit-user-select:text;user-select:text}
.tx.static{max-height:none;color:var(--fg);padding:0}.tx.static .spoken{color:var(--fg)}
.tx .spoken{margin:4px 0 10px}
.tx .meta{color:#9b51e0;font-style:italic;font-size:13px;font-weight:600;letter-spacing:.02em;margin:14px 0 2px;display:flex;align-items:center;gap:6px}
.tx .meta.para::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#9b51e055,transparent)}
.tx .meta.bad{color:#d70015}
.tx .meta.in{animation:metaIn .5s ease-out both}
.tx .w{display:inline-block;opacity:0;animation:wIn .5s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wIn{from{opacity:0;transform:translateY(.4em);filter:blur(5px)}60%{opacity:1}to{opacity:1;transform:none;filter:none}}
@keyframes metaIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tx .w,.tx .meta.in{animation:none;opacity:1}}
.rechead{display:flex;align-items:center;gap:6px;min-width:0}
.recstat{font-weight:600;color:#ff3b30;font-variant-numeric:tabular-nums;white-space:nowrap}.recstat.paused{color:#ff9f0a}
.rechead ~ button:not(.ib){min-height:36px;padding:4px 14px;margin:0 3px;border-radius:18px;font-size:15px;font-weight:600;border:0;background:rgba(118,118,128,.14);color:#1c1c1e}
.ink-top button.primary{background:#ff3b30!important;color:#fff!important}
.ptitle{font:600 17px -apple-system,system-ui!important;background:transparent!important;border:0!important;color:#1c1c1e!important;min-width:120px;max-width:340px}
.recmsg{padding:0 14px}.recmsg .bar{background:#e5e5ea}.recmsg .mut{color:#8e8e93}
.ib.small{font-size:20px}
@media (orientation:portrait){.split{flex-direction:column}.txpanel{width:auto;height:var(--w,300px)}.split-h{width:auto;height:12px;cursor:row-resize}.split-h::after{left:50%;top:4px;width:44px;height:4px;margin:0 0 0 -22px}}
</style></head><body><header class="topbar"><b><span class="logo">◉</span>Trascrizione</b><nav><a href="#/" data-nav="">Archivio</a><a href="#/rec" data-nav="rec">● Registra</a><a href="#/import" data-nav="import">Carica audio</a><a href="#/test" data-nav="test">Dispositivo</a></nav></header><main id="app"></main>
<script type="module" src="app.js"></script></body></html>
